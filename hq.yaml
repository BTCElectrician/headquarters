# The registry: every repository this headquarters routes work to.
#
# Agents read this file to decide which repository owns a piece of work.
# Your agent fills it in when you say "Set up my headquarters" (see SETUP.md).
# Check it with: python3 ops/validate_registry.py
#
# Format rules (the scripts read this file without any extra packages):
#   - indent with two spaces, never tabs
#   - write true or false, not yes or no
#   - if a value contains ": " or starts with a symbol, wrap it in double quotes
#   - for long text, put > after the key and continue on indented lines

hq:
  name: "My headquarters"
  # Folder that holds your repositories. A relative path is relative to this
  # file, so ".." means "the folder this headquarters sits in".
  repos_root: ".."

# Each entry is keyed by the repository's short name.
#   path                        folder under repos_root (or an absolute path)
#   purpose                     one sentence: what the repository is for
#   rules_file                  the file workers must follow there, or null
#   status_file                 optional: its current-state file (STATUS.md)
#   main_deploys_to_production  true if pushing main ships to production
#   release_notes               optional: anything else about how it releases
#   uses                        optional: the registered repositories this one depends on
#
# The two entries below are samples only. They are commented out so they do
# not count as real repositories. Replace them with your own.
#
#   storefront-app:
#     path: "storefront-app"
#     purpose: "The customer-facing web app."
#     rules_file: "AGENTS.md"
#     status_file: "STATUS.md"
#     main_deploys_to_production: true
#     release_notes: "Merging to main deploys the site within a few minutes."
#     uses:
#       - storefront-api
#
#   storefront-api:
#     path: "storefront-api"
#     purpose: "The API the web app calls for orders and payments."
#     rules_file: "AGENTS.md"
#     main_deploys_to_production: false
#     release_notes: "Releases are tagged by hand after a staging check."
repos: {}

# Optional named groups, for commands like "check the storefront repos".
# Every member must be a repository registered above. Sample:
#
#   storefront:
#     - storefront-app
#     - storefront-api
groups: {}
